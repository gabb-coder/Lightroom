<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#1b1b1b}
a{color:#cfcfcf}a:hover{color:#ffffff}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #4aa3ff;outline-offset:1px}
.rng{-webkit-appearance:none;appearance:none;height:16px;margin:0;background:transparent;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:2px;background:#3d3d3d;border-radius:1px}
.rng::-moz-range-track{height:2px;background:#3d3d3d}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:#d6d6d6;border:none}
.rng::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#d6d6d6;border:none}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #1b1b1b; color: #cfcfcf; font-family: Inter, system-ui, sans-serif; font-size: 12px; line-height: 1.35; overflow: hidden">

<header style="flex: 0 0 auto; height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 16px; background: #161616; border-bottom: 1px solid #2f2f2f; box-sizing: border-box">
<div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#cfcfcf" stroke-width="1.4"><circle cx="9" cy="9" r="7.25"></circle><path d="M9 1.75L12.4 7.9M16.2 9.2L9.6 12.5M12.3 15.6L5.6 12M1.8 9.6L6.2 4.4M4.9 3L12.6 3.4"></path></svg>
<span style="font-size: 13px; font-weight: 600; color: #ececec">Darkslide</span>
</div>
<nav aria-label="Modules" style="display: flex; gap: 2px">
<a href="Library.dc.html" style="padding: 0 14px; height: 44px; display: flex; align-items: center; color: #b5b5b5; text-decoration: none; font-weight: 500">Library</a>
<a href="Develop.dc.html" style="padding: 0 14px; height: 44px; display: flex; align-items: center; color: #b5b5b5; text-decoration: none; font-weight: 500">Develop</a>
<a href="Export.dc.html" aria-current="page" style="padding: 0 14px; height: 44px; display: flex; align-items: center; color: #ffffff; text-decoration: none; font-weight: 600; box-shadow: inset 0 -2px 0 #4aa3ff">Export</a>
</nav>
<div style="flex: 1 1 0"></div>
</header>

<div aria-hidden="true" style="flex: 1 1 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; align-content: start">
<sc-for list="{{bg}}" as="t" hint-placeholder-count="12">
<div style="padding: 8px; border-radius: 4px; background: #242424; box-shadow: {{t.ring}}">
<div style="width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #000000">
<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" style="display: block; width: 100%; height: 100%"><defs><linearGradient id="ge{{$index}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{t.p.sky1}}"></stop><stop offset="1" stop-color="{{t.p.sky2}}"></stop></linearGradient></defs><rect x="0" y="0" width="600" height="280" fill="url(#ge{{$index}})"></rect><circle cx="{{t.sunX}}" cy="196" r="30" fill="{{t.p.sun}}"></circle><polygon points="0,232 70,170 130,206 210,138 290,200 360,158 440,214 520,168 600,206 600,280 0,280" fill="{{t.p.far}}"></polygon><polygon points="0,254 90,204 170,242 250,196 330,246 400,214 480,250 560,220 600,236 600,280 0,280" fill="{{t.p.mid}}"></polygon><rect x="0" y="272" width="600" height="70" fill="{{t.p.water}}"></rect><polygon points="0,338 110,316 220,330 330,304 450,326 600,308 600,400 0,400" fill="{{t.p.ground}}"></polygon></svg>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; inset: 44px 0 0 0; background: rgba(0, 0, 0, 0.62); display: flex; align-items: flex-start; justify-content: center; padding: 56px 16px 32px; box-sizing: border-box; overflow-y: auto">
<div role="dialog" aria-modal="true" aria-labelledby="exp-title" style="width: 100%; max-width: 760px; background: #262626; border: 1px solid #353535; border-radius: 8px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; overflow: hidden">

<div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; border-bottom: 1px solid #333333">
<h2 id="exp-title" style="margin: 0; font-size: 15px; font-weight: 600; color: #f2f2f2">Export 3 photos</h2>
<button aria-label="Close" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 4px; background: transparent; color: #b5b5b5"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
</div>

<div style="display: flex; flex-wrap: wrap">
<div style="flex: 1 1 200px; padding: 14px 10px; border-right: 1px solid #333333; background: #222222; box-sizing: border-box">
<div style="padding: 0 8px 6px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #9e9e9e">Export presets</div>
<button aria-current="true" style="width: 100%; height: 30px; display: flex; align-items: center; padding: 0 8px; border: none; border-radius: 3px; background: rgba(74, 163, 255, 0.18); color: #ffffff; text-align: left">For web, 2048 px</button>
<button style="width: 100%; height: 30px; display: flex; align-items: center; padding: 0 8px; border: none; border-radius: 3px; background: transparent; color: #cfcfcf; text-align: left">Full size JPEG</button>
<button style="width: 100%; height: 30px; display: flex; align-items: center; padding: 0 8px; border: none; border-radius: 3px; background: transparent; color: #cfcfcf; text-align: left">Social square, 1080 px</button>
<button style="width: 100%; height: 30px; display: flex; align-items: center; padding: 0 8px; border: none; border-radius: 3px; background: transparent; color: #cfcfcf; text-align: left">PNG, lossless</button>
<button style="width: 100%; height: 30px; margin-top: 6px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: none; border-radius: 3px; background: transparent; color: #9e9e9e; text-align: left"><span aria-hidden="true" style="font-size: 15px; line-height: 1">+</span>Save as preset</button>
</div>

<div style="flex: 999 1 380px; padding: 6px 20px 16px; box-sizing: border-box; min-width: 0">

<fieldset style="border: none; margin: 0; padding: 12px 0; border-bottom: 1px solid #333333">
<legend style="padding: 0; margin-bottom: 10px; font-weight: 600; color: #ececec">Location</legend>
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; row-gap: 10px; column-gap: 12px">
<label for="ex-dest" style="color: #b5b5b5">Export to</label>
<div style="display: flex; gap: 6px">
<select id="ex-dest" style="flex: 1 1 auto; min-width: 0; height: 28px; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 6px"><option>Downloads</option><option>Same folder as original</option><option>Choose folder…</option></select>
<button style="height: 28px; padding: 0 10px; border: 1px solid #3a3a3a; border-radius: 4px; background: #2e2e2e; color: #e2e2e2">Choose…</button>
</div>
<span></span>
<label style="display: flex; align-items: center; gap: 8px; color: #cfcfcf"><input type="checkbox" checked style="accent-color: #4aa3ff; width: 14px; height: 14px; margin: 0">Put in subfolder</label>
<label for="ex-sub" style="color: #b5b5b5">Subfolder name</label>
<input id="ex-sub" type="text" value="Exports" style="height: 28px; box-sizing: border-box; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 8px">
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 12px 0; border-bottom: 1px solid #333333">
<legend style="padding: 0; margin-bottom: 10px; font-weight: 600; color: #ececec">File naming</legend>
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; row-gap: 8px; column-gap: 12px">
<label for="ex-name" style="color: #b5b5b5">Rename to</label>
<select id="ex-name" style="height: 28px; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 6px"><option>Original file name</option><option>Custom name with sequence</option><option>Date and sequence</option></select>
<span></span>
<span style="color: #9e9e9e">Example: IMG_0418.jpg</span>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 12px 0; border-bottom: 1px solid #333333">
<legend style="padding: 0; margin-bottom: 10px; font-weight: 600; color: #ececec">File settings</legend>
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; row-gap: 10px; column-gap: 12px">
<span style="color: #b5b5b5">Format</span>
<div role="group" aria-label="Format" style="display: flex; width: fit-content; padding: 2px; gap: 2px; background: #1b1b1b; border-radius: 4px">
<button aria-pressed="true" style="height: 24px; padding: 0 14px; border: none; border-radius: 3px; background: #3a3a3a; color: #ffffff">JPEG</button>
<button aria-pressed="false" style="height: 24px; padding: 0 14px; border: none; border-radius: 3px; background: transparent; color: #a8a8a8">PNG</button>
</div>
<label for="ex-q" style="color: #b5b5b5">Quality</label>
<div style="display: flex; align-items: center; gap: 10px">
<input class="rng" id="ex-q" type="range" min="1" max="100" value="85" style="flex: 1 1 auto; min-width: 0">
<output for="ex-q" style="width: 28px; text-align: right; color: #f2f2f2; font-variant-numeric: tabular-nums">85</output>
</div>
<label for="ex-cs" style="color: #b5b5b5">Color space</label>
<select id="ex-cs" style="width: fit-content; height: 28px; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 6px"><option>sRGB</option><option>Display P3</option></select>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 12px 0; border-bottom: 1px solid #333333">
<legend style="padding: 0; margin-bottom: 10px; font-weight: 600; color: #ececec">Image sizing</legend>
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; row-gap: 10px; column-gap: 12px">
<span></span>
<label style="display: flex; align-items: center; gap: 8px; color: #cfcfcf"><input type="checkbox" checked style="accent-color: #4aa3ff; width: 14px; height: 14px; margin: 0">Resize to fit</label>
<label for="ex-fit" style="color: #b5b5b5">Fit</label>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<select id="ex-fit" style="height: 28px; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 6px"><option>Long edge</option><option>Short edge</option><option>Width and height</option></select>
<label for="ex-px" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Long edge in pixels</label>
<input id="ex-px" type="number" value="2048" style="width: 76px; height: 28px; box-sizing: border-box; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 8px; font-variant-numeric: tabular-nums">
<span style="color: #9e9e9e">px</span>
</div>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 12px 0 0">
<legend style="padding: 0; margin-bottom: 10px; font-weight: 600; color: #ececec">Metadata</legend>
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; column-gap: 12px">
<label for="ex-meta" style="color: #b5b5b5">Include</label>
<select id="ex-meta" style="width: fit-content; height: 28px; border: 1px solid #3a3a3a; border-radius: 4px; background: #1b1b1b; color: #e2e2e2; font: inherit; padding: 0 6px"><option>Copyright only</option><option>All except location</option><option>All metadata</option><option>None</option></select>
</div>
</fieldset>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid #333333; background: #222222">
<span style="color: #9e9e9e">Originals are never changed. Edits are applied at full resolution.</span>
<div style="flex: 1 1 auto"></div>
<button style="height: 32px; padding: 0 14px; border: 1px solid #3a3a3a; border-radius: 4px; background: #2e2e2e; color: #e2e2e2">Cancel</button>
<button style="height: 32px; padding: 0 16px; border: none; border-radius: 4px; background: #4aa3ff; color: #0b1a2b; font-weight: 600">Export 3 photos</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var pal = [
      { sky1: '#26385a', sky2: '#e3a06a', sun: '#ffd9a6', far: '#5b5e7c', mid: '#3c3f5c', water: '#7a6c86', ground: '#14151f' },
      { sky1: '#3f78b8', sky2: '#b9d6ee', sun: '#fff6dc', far: '#6f8fa8', mid: '#4a6a7f', water: '#5d8fb3', ground: '#1d2d24' },
      { sky1: '#607a6a', sky2: '#c9d4b8', sun: '#f4f1dc', far: '#4f6b55', mid: '#36503d', water: '#5c7a68', ground: '#162119' },
      { sky1: '#0d1426', sky2: '#2b3d6b', sun: '#e9eefc', far: '#273352', mid: '#1b2440', water: '#2a3a63', ground: '#080c16' },
      { sky1: '#d98a54', sky2: '#f3d1a0', sun: '#fff1d0', far: '#b8704a', mid: '#94573a', water: '#c49270', ground: '#3d2318' },
      { sky1: '#8b9097', sky2: '#d4d6d8', sun: '#f6f6f4', far: '#9ea3aa', mid: '#848a92', water: '#a9adb3', ground: '#3c4046' }
    ];
    var bg = [];
    for (var i = 0; i < 18; i++) bg.push({ p: pal[(i * 5) % pal.length], sunX: 140 + (i * 83) % 360, ring: (i === 0 || i === 3 || i === 7) ? '0 0 0 2px #4aa3ff' : '0 0 0 1px #2f2f2f' });
    return { bg: bg };
  }
}
</script>
</body>
</html>
