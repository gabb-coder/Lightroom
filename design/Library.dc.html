<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#1b1b1b}
a{color:#cfcfcf}a:hover{color:#ffffff}
.app{height:100vh;min-height:640px}
.scroll{overflow-y:auto}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #4aa3ff;outline-offset:1px}
.rng{-webkit-appearance:none;appearance:none;height:16px;margin:0;background:transparent;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:2px;background:#3d3d3d;border-radius:1px}
.rng::-moz-range-track{height:2px;background:#3d3d3d}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:#d6d6d6;border:none}
.rng::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#d6d6d6;border:none}
@media (max-width:900px){.app{height:auto}.scroll{overflow:visible}.lp{order:3}}
</style>
</helmet>
<div class="app" style="display: flex; flex-direction: column; box-sizing: border-box; background: #1b1b1b; color: #cfcfcf; font-family: Inter, system-ui, sans-serif; font-size: 12px; line-height: 1.35">

<header style="flex: 0 0 auto; height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 16px; background: #161616; border-bottom: 1px solid #2f2f2f; box-sizing: border-box">
<div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#cfcfcf" stroke-width="1.4"><circle cx="9" cy="9" r="7.25"></circle><path d="M9 1.75L12.4 7.9M16.2 9.2L9.6 12.5M12.3 15.6L5.6 12M1.8 9.6L6.2 4.4M4.9 3L12.6 3.4"></path></svg>
<span style="font-size: 13px; font-weight: 600; color: #ececec">Darkslide</span>
</div>
<nav aria-label="Modules" style="display: flex; gap: 2px">
<a href="Library.dc.html" aria-current="page" style="padding: 0 14px; height: 44px; display: flex; align-items: center; color: #ffffff; text-decoration: none; font-weight: 600; box-shadow: inset 0 -2px 0 #4aa3ff">Library</a>
<a href="Develop.dc.html" style="padding: 0 14px; height: 44px; display: flex; align-items: center; color: #b5b5b5; text-decoration: none; font-weight: 500">Develop</a>
<a href="Export.dc.html" style="padding: 0 14px; height: 44px; display: flex; align-items: center; color: #b5b5b5; text-decoration: none; font-weight: 500">Export</a>
</nav>
<div style="flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-end">
<button style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: none; border-radius: 4px; background: #4aa3ff; color: #0b1a2b; font-weight: 600">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8"></path><path d="M5 7l3 3 3-3"></path><path d="M2 11.5V14h12v-2.5"></path></svg>Import</button>
</div>
</header>

<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap">

<aside class="lp scroll" aria-label="Catalog and folders" style="flex: 1 1 232px; max-width: 100%; min-width: 0; box-sizing: border-box; background: #232323; border-right: 1px solid #2f2f2f; padding: 8px 8px 16px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<div style="padding: 10px 8px 4px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #9e9e9e">{{n.title}}</div>
<sc-for list="{{n.items}}" as="it" hint-placeholder-count="3">
<button aria-current="{{it.current}}" style="width: 100%; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: none; border-radius: 3px; background: {{it.bg}}; color: {{it.fg}}; text-align: left">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg>
<span style="flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.label}}</span>
<span style="color: #9e9e9e; font-variant-numeric: tabular-nums">{{it.count}}</span>
</button>
</sc-for>
</sc-for>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #1b1b1b">
<div role="toolbar" aria-label="Filters" style="flex: 0 0 auto; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 7px 16px; box-sizing: border-box; border-bottom: 1px solid #2f2f2f; background: #1f1f1f">
<div role="group" aria-label="Flag filter" style="display: flex; padding: 2px; gap: 2px; background: #161616; border-radius: 4px">
<sc-for list="{{flagFilters}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 24px; padding: 0 10px; border: none; border-radius: 3px; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<label for="minrating" style="color: #9e9e9e">Rating</label>
<select id="minrating" onChange="{{setMinRating}}" style="height: 26px; border: 1px solid #3a3a3a; border-radius: 4px; background: #161616; color: #e2e2e2; font: inherit; padding: 0 4px">
<option value="0">Any</option><option value="1">1+ stars</option><option value="2">2+ stars</option><option value="3">3+ stars</option><option value="4">4+ stars</option><option value="5">5 stars</option>
</select>
</div>
<div role="group" aria-label="Color label filter" style="display: flex; align-items: center; gap: 6px">
<span style="color: #9e9e9e">Label</span>
<sc-for list="{{labelFilters}}" as="lf" hint-placeholder-count="5">
<button onClick="{{lf.pick}}" aria-pressed="{{lf.pressed}}" aria-label="{{lf.name}} label" style="width: 18px; height: 18px; padding: 0; border-radius: 50%; border: none; background: {{lf.c}}; box-shadow: {{lf.ring}}"></button>
</sc-for>
</div>
<div style="flex: 1 1 auto"></div>
<label style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid #3a3a3a; border-radius: 4px; background: #161616; min-width: 160px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search photos</span>
<input type="search" placeholder="Search file name" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: #e2e2e2; font: inherit; outline: none">
</label>
<div style="display: flex; align-items: center; gap: 6px">
<label for="sort" style="color: #9e9e9e">Sort</label>
<select id="sort" style="height: 26px; border: 1px solid #3a3a3a; border-radius: 4px; background: #161616; color: #e2e2e2; font: inherit; padding: 0 4px"><option>Capture time</option><option>Import order</option><option>File name</option><option>Rating</option></select>
</div>
</div>

<div class="scroll" style="flex: 1 1 auto; min-height: 0; padding: 16px">
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #9e9e9e">
<span style="color: #e2e2e2; font-size: 13px; font-weight: 500">No photos match these filters</span>
<button onClick="{{clearFilters}}" style="height: 28px; padding: 0 12px; border: 1px solid #3a3a3a; border-radius: 4px; background: #2a2a2a; color: #e2e2e2">Clear filters</button>
</div>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax({{cellMin}}px, 1fr)); gap: 10px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="12">
<li>
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.name}}" style="width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px; border: none; border-radius: 4px; background: {{c.bg}}; box-shadow: {{c.ring}}; color: #cfcfcf; text-align: left">
<div style="display: flex; justify-content: space-between; width: 100%; color: #9e9e9e; font-size: 11px; font-variant-numeric: tabular-nums"><span>{{c.num}}</span><span>{{c.name}}</span></div>
<div style="position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #000000; opacity: {{c.opacity}}">
<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%; height: 100%"><defs><linearGradient id="gl{{$index}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{c.p.sky1}}"></stop><stop offset="1" stop-color="{{c.p.sky2}}"></stop></linearGradient></defs><rect x="0" y="0" width="600" height="280" fill="url(#gl{{$index}})"></rect><circle cx="{{c.sunX}}" cy="196" r="30" fill="{{c.p.sun}}"></circle><polygon points="0,232 70,170 130,206 210,138 290,200 360,158 440,214 520,168 600,206 600,280 0,280" fill="{{c.p.far}}"></polygon><polygon points="0,254 90,204 170,242 250,196 330,246 400,214 480,250 560,220 600,236 600,280 0,280" fill="{{c.p.mid}}"></polygon><rect x="0" y="272" width="600" height="70" fill="{{c.p.water}}"></rect><polygon points="0,338 110,316 220,330 330,304 450,326 600,308 600,400 0,400" fill="{{c.p.ground}}"></polygon></svg>
</div>
<div style="display: flex; align-items: center; gap: 6px; width: 100%; height: 16px">
<span aria-label="{{c.ratingLabel}}" style="letter-spacing: 1px; color: #d8d8d8; font-size: 11px">{{c.stars}}</span>
<div style="flex: 1 1 auto"></div>
<sc-if value="{{c.edited}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Edited" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-linecap="round"><path d="M2 5h12M2 11h12"></path><circle cx="6" cy="5" r="1.8" fill="#262626"></circle><circle cx="10" cy="11" r="1.8" fill="#262626"></circle></svg></sc-if>
<sc-if value="{{c.picked}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Picked" width="12" height="12" viewBox="0 0 16 16" fill="#e2e2e2" stroke="#e2e2e2" stroke-width="1.4" stroke-linejoin="round"><path d="M4 14V2" fill="none"></path><path d="M4 2.5h8l-2 3 2 3H4"></path></svg></sc-if>
<sc-if value="{{c.rejected}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Rejected" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#9e9e9e" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></sc-if>
<sc-if value="{{c.hasLabel}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{c.labelName}} label" style="width: 10px; height: 10px; border-radius: 50%; background: {{c.labelColor}}"></span></sc-if>
</div>
</button>
</li>
</sc-for>
</ul>
</div>

<div style="flex: 0 0 auto; height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-top: 1px solid #2f2f2f; background: #161616; color: #9e9e9e; font-variant-numeric: tabular-nums">
<span>{{shownCount}} of 20 photos</span><span>{{selCount}} selected</span>
<div style="flex: 1 1 auto"></div>
<label for="thumbsize">Thumbnails</label>
<input class="rng" id="thumbsize" type="range" min="140" max="320" step="10" value="{{cellMin}}" onChange="{{setCell}}" style="width: 120px">
</div>
</main>

<aside class="scroll" aria-label="Photo details" style="flex: 1 1 280px; max-width: 100%; min-width: 0; box-sizing: border-box; background: #232323; border-left: 1px solid #2f2f2f; display: flex; flex-direction: column">
<section aria-label="Preview" style="padding: 12px 14px; border-bottom: 1px solid #2f2f2f">
<div style="position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #000000">
<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Preview of {{info.name}}" style="display: block; width: 100%; height: 100%"><defs><linearGradient id="gli" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{info.p.sky1}}"></stop><stop offset="1" stop-color="{{info.p.sky2}}"></stop></linearGradient></defs><rect x="0" y="0" width="600" height="280" fill="url(#gli)"></rect><circle cx="{{info.sunX}}" cy="196" r="30" fill="{{info.p.sun}}"></circle><polygon points="0,232 70,170 130,206 210,138 290,200 360,158 440,214 520,168 600,206 600,280 0,280" fill="{{info.p.far}}"></polygon><polygon points="0,254 90,204 170,242 250,196 330,246 400,214 480,250 560,220 600,236 600,280 0,280" fill="{{info.p.mid}}"></polygon><rect x="0" y="272" width="600" height="70" fill="{{info.p.water}}"></rect><polygon points="0,338 110,316 220,330 330,304 450,326 600,308 600,400 0,400" fill="{{info.p.ground}}"></polygon></svg>
</div>
<a href="Develop.dc.html" style="margin-top: 10px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: #4aa3ff; color: #0b1a2b; font-weight: 600; text-decoration: none">Edit in Develop</a>
</section>
<section aria-label="Metadata" style="padding: 10px 14px 14px">
<div style="height: 26px; display: flex; align-items: center; font-weight: 600; color: #ececec">Metadata</div>
<dl style="margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 7px; column-gap: 10px">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="9">
<dt style="color: #9e9e9e">{{m.k}}</dt><dd style="margin: 0; color: #e2e2e2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere">{{m.v}}</dd>
</sc-for>
</dl>
</section>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { sel: [0, 3, 7], focus: 0, flagF: 'all', minRating: 0, labelF: null, cellMin: 190 };
  }
  palettes() {
    return [
      { sky1: '#26385a', sky2: '#e3a06a', sun: '#ffd9a6', far: '#5b5e7c', mid: '#3c3f5c', water: '#7a6c86', ground: '#14151f' },
      { sky1: '#3f78b8', sky2: '#b9d6ee', sun: '#fff6dc', far: '#6f8fa8', mid: '#4a6a7f', water: '#5d8fb3', ground: '#1d2d24' },
      { sky1: '#607a6a', sky2: '#c9d4b8', sun: '#f4f1dc', far: '#4f6b55', mid: '#36503d', water: '#5c7a68', ground: '#162119' },
      { sky1: '#0d1426', sky2: '#2b3d6b', sun: '#e9eefc', far: '#273352', mid: '#1b2440', water: '#2a3a63', ground: '#080c16' },
      { sky1: '#d98a54', sky2: '#f3d1a0', sun: '#fff1d0', far: '#b8704a', mid: '#94573a', water: '#c49270', ground: '#3d2318' },
      { sky1: '#8b9097', sky2: '#d4d6d8', sun: '#f6f6f4', far: '#9ea3aa', mid: '#848a92', water: '#a9adb3', ground: '#3c4046' }
    ];
  }
  labels() {
    return [{ id: 'red', name: 'Red', c: '#d9534f' }, { id: 'yellow', name: 'Yellow', c: '#e3c84a' }, { id: 'green', name: 'Green', c: '#5cb85c' }, { id: 'blue', name: 'Blue', c: '#4a7fe0' }, { id: 'purple', name: 'Purple', c: '#9b6be0' }];
  }
  photos() {
    var ratings = [3, 5, 0, 2, 4, 1, 3, 4, 0, 5, 2, 3, 4, 0, 1, 5, 3, 2, 4, 0];
    var flags = ['', 'pick', 'reject', '', 'pick', '', '', 'pick', 'reject', 'pick', '', '', 'pick', '', 'reject', 'pick', '', '', '', ''];
    var lbls = [null, 'red', null, null, 'green', null, 'yellow', null, null, 'red', null, 'blue', null, null, null, 'purple', null, 'yellow', 'green', null];
    var pal = this.palettes(), out = [];
    for (var i = 0; i < 20; i++) {
      out.push({ i: i, p: pal[(i * 5) % pal.length], sunX: 140 + (i * 83) % 360, name: 'IMG_' + ('0000' + (418 + i)).slice(-4) + '.JPG', rating: ratings[i], flag: flags[i], label: lbls[i], edited: i % 3 === 0 });
    }
    return out;
  }
  renderVals() {
    var self = this, st = this.state, labels = this.labels(), all = this.photos();
    var labelMap = {};
    labels.forEach(function (l) { labelMap[l.id] = l; });
    var shown = all.filter(function (p) {
      if (st.flagF === 'picks' && p.flag !== 'pick') return false;
      if (st.flagF === 'rejected' && p.flag !== 'reject') return false;
      if (st.flagF === 'unflagged' && p.flag) return false;
      if (p.rating < st.minRating) return false;
      if (st.labelF && p.label !== st.labelF) return false;
      return true;
    });
    var cells = shown.map(function (p) {
      var on = st.sel.indexOf(p.i) >= 0;
      var lb = p.label ? labelMap[p.label] : null;
      return {
        p: p.p, sunX: p.sunX, name: p.name, num: String(p.i + 1), edited: p.edited,
        stars: p.rating ? '★★★★★'.slice(0, p.rating) : '·  ·  ·', ratingLabel: p.rating ? p.rating + ' star rating' : 'No rating',
        picked: p.flag === 'pick', rejected: p.flag === 'reject', opacity: p.flag === 'reject' ? '0.45' : '1',
        hasLabel: !!lb, labelColor: lb ? lb.c : 'transparent', labelName: lb ? lb.name : '',
        pressed: on ? 'true' : 'false', bg: on ? '#2e2e2e' : '#242424', ring: on ? '0 0 0 2px #4aa3ff' : '0 0 0 1px #2f2f2f',
        pick: function (e) {
          var s = st.sel.slice(), k = s.indexOf(p.i);
          if (e && (e.metaKey || e.ctrlKey || e.shiftKey)) { if (k >= 0) s.splice(k, 1); else s.push(p.i); }
          else s = [p.i];
          self.setState({ sel: s, focus: p.i });
        }
      };
    });
    var fp = all[st.focus];
    var seg = function (id, label) {
      var on = st.flagF === id;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#3a3a3a' : 'transparent', fg: on ? '#ffffff' : '#a8a8a8', pick: function () { self.setState({ flagF: id }); } };
    };
    var I = { all: 'M2 3h12v10H2zM2 10l3.5-3 3 2.5L11 7l3 3', recent: 'M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM8 5v3l2 1.5', folder: 'M1.5 4.5h5l1.5 1.5h6.5v7h-13z', coll: 'M3 3h10v10H3zM5.5 1.5h7' };
    var nav = [
      { title: 'Catalog', items: [{ label: 'All photographs', count: 20, icon: I.all, current: 'page' }, { label: 'Previous import', count: 14, icon: I.recent }] },
      { title: 'Folders', items: [{ label: '[Trip folder]', count: 14, icon: I.folder }, { label: '[Second folder]', count: 6, icon: I.folder }] },
      { title: 'Collections', items: [{ label: 'Portfolio', count: 6, icon: I.coll }, { label: 'To print', count: 3, icon: I.coll }] }
    ].map(function (g) {
      return { title: g.title, items: g.items.map(function (it) {
        var cur = it.current === 'page';
        return { label: it.label, count: it.count, icon: it.icon, current: cur ? 'page' : 'false', bg: cur ? 'rgba(74, 163, 255, 0.18)' : 'transparent', fg: cur ? '#ffffff' : '#cfcfcf' };
      }) };
    });
    return {
      nav: nav, cells: cells, empty: cells.length === 0, shownCount: cells.length, selCount: st.sel.length, cellMin: st.cellMin,
      setCell: function (e) { self.setState({ cellMin: parseInt(e.target.value, 10) }); },
      setMinRating: function (e) { self.setState({ minRating: parseInt(e.target.value, 10) }); },
      clearFilters: function () { self.setState({ flagF: 'all', minRating: 0, labelF: null }); },
      flagFilters: [seg('all', 'All'), seg('picks', 'Picks'), seg('unflagged', 'Unflagged'), seg('rejected', 'Rejected')],
      labelFilters: labels.map(function (l) {
        var on = st.labelF === l.id;
        return { name: l.name, c: l.c, pressed: on ? 'true' : 'false', ring: on ? '0 0 0 2px #1f1f1f, 0 0 0 4px #ffffff' : 'none', pick: function () { self.setState({ labelF: on ? null : l.id }); } };
      }),
      info: { name: fp.name, p: fp.p, sunX: fp.sunX },
      meta: [
        { k: 'File name', v: fp.name }, { k: 'Captured', v: '[Date and time]' }, { k: 'Dimensions', v: '6000 × 4000' },
        { k: 'Camera', v: '[Camera model]' }, { k: 'Lens', v: '[Lens]' }, { k: 'Focal length', v: '35 mm' },
        { k: 'Exposure', v: '1/125 s at f/8' }, { k: 'ISO', v: '200' },
        { k: 'Rating', v: fp.rating ? fp.rating + ' of 5' : 'None' }, { k: 'Flag', v: fp.flag === 'pick' ? 'Picked' : fp.flag === 'reject' ? 'Rejected' : 'None' }
      ]
    };
  }
}
</script>
</body>
</html>
