# Render Blueprint: https://render.com/docs/blueprint-spec
# Static site built from this repo; Render serves the files in dist/.
services:
  - type: web
    runtime: static
    name: lightroom-web
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # Cross-origin isolation (needed later for SharedArrayBuffer / threaded WASM).
      # Keep in sync with `isolationHeaders` in vite.config.ts.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      # Vite content-hashes everything in /assets, so it can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must always be revalidated so new deploys show up immediately.
      # Disjoint paths are used because Render doesn't document precedence
      # between overlapping Cache-Control rules.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # The service worker (M33) must be re-checked on every visit, so updates install.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
